services:
  hmg-calendar:
    build:
      context: .
    image: ghcr.io/djdh98/hmg-calendar:latest
    container_name: hmg-calendar
    restart: unless-stopped
    environment:
      RADARR_URL: ${RADARR_URL:-http://radarr:7878}
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_URL: ${SONARR_URL:-http://sonarr:8989}
      SONARR_API_KEY: ${SONARR_API_KEY}
      PORT: 3000
    expose:
      - "3000"
    networks:
      - ibrapproxy

networks:
  ibrapproxy:
    external: true
